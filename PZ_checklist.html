<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PZ Checklist — книги, журналы, VHS</title>
<style>
  :root{
    --bg:#f4f2ec;
    --panel:#ffffff;
    --border:#e2ddd0;
    --text:#221f1a;
    --muted:#726b5c;
    --accent:#8a5a34;
    --accent-contrast:#fff8f0;
    --danger:#a8402a;
    --chip:#efe8da;
    --chip-text:#5b4d38;
    --track:#e6e0d2;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1b1a16;
      --panel:#242220;
      --border:#3a362c;
      --text:#ede7d9;
      --muted:#a89c85;
      --accent:#d0985c;
      --accent-contrast:#211a10;
      --danger:#e2795c;
      --chip:#2e2a22;
      --chip-text:#d0985c;
      --track:#33302a;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.4;
  }
  a{color:var(--accent);}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 80px;}
  header.top{
    position:sticky;top:0;z-index:10;
    background:var(--bg);
    padding:14px 0 10px;
    border-bottom:1px solid var(--border);
  }
  h1{font-size:1.25rem;margin:0 0 8px;}
  .stats-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .grand{font-weight:600;font-size:.95rem;color:var(--muted);}
  .progress-track{flex:1 1 160px;height:8px;background:var(--track);border-radius:99px;overflow:hidden;min-width:120px;}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .2s ease;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  button{
    font:inherit;cursor:pointer;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    border-radius:8px;
    padding:7px 12px;
    font-size:.85rem;
  }
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);font-weight:600;}
  button.danger-outline{color:var(--danger);border-color:var(--danger);}
  .tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .tabbtn{
    border:1px solid var(--border);background:var(--panel);
    border-radius:99px;padding:7px 14px;font-size:.85rem;
    display:flex;align-items:center;gap:6px;
  }
  .tabbtn.active{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);}
  .tabcount{
    background:rgba(0,0,0,.12);border-radius:99px;padding:1px 7px;font-size:.75rem;font-variant-numeric:tabular-nums;
  }
  .tabbtn.active .tabcount{background:rgba(255,255,255,.25);}
  .panel-tools{display:flex;align-items:center;gap:8px;margin:14px 0 10px;}
  .search-input{
    flex:1 1 auto;padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel);color:var(--text);font-size:.9rem;margin:0;
  }
  .hide-found-toggle{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem;white-space:nowrap;}
  .hide-found-toggle input{margin:0;accent-color:var(--accent);}
  .panel[hidden]{display:none;}
  details.group{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    margin-bottom:10px;overflow:hidden;
  }
  details.group>summary{
    list-style:none;cursor:pointer;padding:10px 14px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:.92rem;
  }
  details.group>summary::-webkit-details-marker{display:none;}
  details.group>summary::before{content:"▸";display:inline-block;margin-right:8px;color:var(--muted);transition:transform .15s;flex:none;}
  details.group[open]>summary::before{transform:rotate(90deg);}
  .group-all-check{
    width:17px;height:17px;accent-color:var(--accent);flex:none;cursor:pointer;margin:0;
  }
  .gname{flex:1;}
  .gcount{
    background:var(--chip);color:var(--chip-text);border-radius:99px;padding:2px 9px;
    font-size:.75rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .gdesc{padding:0 14px 8px;color:var(--muted);font-size:.8rem;}
  .items{border-top:1px solid var(--border);}
  label.item{
    display:flex;gap:10px;align-items:flex-start;
    padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer;
  }
  label.item:last-child{border-bottom:none;}
  label.item:hover{background:rgba(138,90,52,.06);}
  label.item input[type=checkbox]{
    margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none;cursor:pointer;
  }
  .txt{flex:1;min-width:0;}
  .txt .ru{font-size:.92rem;}
  label.item:has(input:checked) .txt .ru{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border);}
  .txt .en{font-size:.78rem;color:var(--muted);font-style:italic;margin-top:1px;}
  .txt .note{font-size:.78rem;color:var(--muted);margin-top:3px;}
  footer.notes{
    margin-top:18px;font-size:.8rem;color:var(--muted);
    background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;
  }
  footer.notes p{margin:0 0 6px;}
  footer.notes p:last-child{margin-bottom:0;}
  #toast{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(10px);
    background:var(--accent);color:var(--accent-contrast);padding:9px 16px;border-radius:8px;
    font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

  var TAB_ORDER = ['books','recipes','vhs'];
  var activeTab = TAB_ORDER[0];
  var fileHandle = null;

  // ---------- нормализация данных: строки -> объекты с key/id/en/ru/note ----------
  TAB_ORDER.forEach(function(tabKey){
    DATA[tabKey].groups.forEach(function(g, gi){
      g.gid = tabKey + '-' + gi;
      g.items = g.items.map(function(row){
        var id, en, ru, note;
        if (row.length === 4) { id = row[0]; en = row[1]; ru = row[2]; note = row[3]; }
        else { en = row[0]; ru = row[1]; note = row[2]; id = en; }
        return { key: tabKey + '|' + id, id: id, en: en, ru: ru, note: note };
      });
    });
  });

  // ---------- состояние ----------
  function loadState(){
    var raw = null;
    try { raw = localStorage.getItem(LS_KEY); } catch(e){}
    if (raw !== null) {
      try { return JSON.parse(raw); } catch(e){}
    }
    try {
      var el = document.getElementById('pz-state');
      return JSON.parse((el && el.textContent) || '{}');
    } catch(e){ return {}; }
  }
  var state = loadState();
  function persist(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
  }

  // ---------- утилиты ----------
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  // ---------- рендер ----------
  function renderTabsNav(){
    var nav = document.getElementById('tabsNav');
    nav.innerHTML = '';
    TAB_ORDER.forEach(function(tabKey){
      var tab = DATA[tabKey];
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tabbtn' + (tabKey === activeTab ? ' active' : '');
      btn.dataset.tab = tabKey;
      btn.innerHTML = tab.icon + ' ' + escapeHtml(tab.title) + ' <span class="tabcount" data-tabcount="' + tabKey + '"></span>';
      nav.appendChild(btn);
    });
  }

  function getHideFoundState(tabKey){
    if (!state._settings) state._settings = {};
    if (!state._settings.hideFound) state._settings.hideFound = {};
    return !!state._settings.hideFound[tabKey];
  }

  function setHideFoundState(tabKey, value){
    if (!state._settings) state._settings = {};
    if (!state._settings.hideFound) state._settings.hideFound = {};
    if (value) state._settings.hideFound[tabKey] = true;
    else delete state._settings.hideFound[tabKey];
    persist();
  }

  function renderPanels(){
    var main = document.getElementById('tabPanels');
    main.innerHTML = '';
    TAB_ORDER.forEach(function(tabKey){
      var tab = DATA[tabKey];
      var section = document.createElement('section');
      section.className = 'panel';
      section.id = 'panel-' + tabKey;
      if (tabKey !== activeTab) section.hidden = true;

      var groups = tab.groups.slice().sort(function(a, b){
        var an = (a && a.name) ? String(a.name) : '';
        var bn = (b && b.name) ? String(b.name) : '';
        return an.localeCompare(bn, 'ru', { sensitivity: 'base' });
      });

      var tools = document.createElement('div');
      tools.className = 'panel-tools';

      var search = document.createElement('input');
      search.type = 'search';
      search.className = 'search-input';
      search.placeholder = 'Поиск по названию, ID, эффекту…';
      search.dataset.tab = tabKey;
      tools.appendChild(search);

      var hideToggle = document.createElement('label');
      hideToggle.className = 'hide-found-toggle';
      hideToggle.innerHTML = '<input type="checkbox" class="hide-found-toggle-input" data-tab="' + tabKey + '"' + (getHideFoundState(tabKey) ? ' checked' : '') + '> <span>Скрыть найденные</span>';
      tools.appendChild(hideToggle);
      section.appendChild(tools);

      groups.forEach(function(g){
        var details = document.createElement('details');
        details.className = 'group';
        details.open = true;
        details.dataset.gid = g.gid;

        var summary = document.createElement('summary');
        summary.innerHTML = '<input type="checkbox" class="group-all-check" data-group-all="' + g.gid + '" title="Отметить/снять всю группу" aria-label="Отметить всю группу ' + escapeHtml(g.name) + '">' +
          '<span class="gname">' + escapeHtml(g.name) + '</span><span class="gcount" data-gcount="' + g.gid + '"></span>';
        details.appendChild(summary);

        if (g.desc) {
          var gd = document.createElement('div');
          gd.className = 'gdesc';
          gd.textContent = g.desc;
          details.appendChild(gd);
        }

        var list = document.createElement('div');
        list.className = 'items';
        g.items.forEach(function(item){
          var row = document.createElement('label');
          row.className = 'item';
          row.dataset.search = (item.ru + ' ' + item.en + ' ' + (item.note||'') + ' ' + item.id).toLowerCase();

          var cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.dataset.key = item.key;
          cb.checked = !!state[item.key];

          var txt = document.createElement('div');
          txt.className = 'txt';
          var html = '<div class="ru">' + escapeHtml(item.ru) + '</div>';
          html += '<div class="en">' + escapeHtml(item.en) + '</div>';
          if (item.note) html += '<div class="note">' + escapeHtml(item.note) + '</div>';
          txt.innerHTML = html;

          row.appendChild(cb);
          row.appendChild(txt);
          list.appendChild(row);
        });
        details.appendChild(list);

        section.appendChild(details);
      });

      if (tab.notes && tab.notes.length) {
        var foot = document.createElement('footer');
        foot.className = 'notes';
        tab.notes.forEach(function(n){
          var p = document.createElement('p');
          p.textContent = n;
          foot.appendChild(p);
        });
        section.appendChild(foot);
      }

      main.appendChild(section);
    });
  }

  function renderApp(){
    renderTabsNav();
    renderPanels();
    updateCounts();
  }

  function findGroup(gid){
    for (var i = 0; i < TAB_ORDER.length; i++){
      var tab = DATA[TAB_ORDER[i]];
      for (var j = 0; j < tab.groups.length; j++){
        if (tab.groups[j].gid === gid) return tab.groups[j];
      }
    }
    return null;
  }

  function toggleGroupAll(gid, newVal){
    var g = findGroup(gid);
    if (!g) return;
    g.items.forEach(function(item){ state[item.key] = newVal; });
    persist();
    var container = document.querySelector('details.group[data-gid="' + gid + '"]');
    if (container) {
      container.querySelectorAll('.items input[type=checkbox][data-key]').forEach(function(cb){
        cb.checked = newVal;
      });
    }
    updateCounts();
  }

  function updateCounts(){
    var grandTotal = 0, grandChecked = 0;
    TAB_ORDER.forEach(function(tabKey){
      var tab = DATA[tabKey];
      var tabTotal = 0, tabChecked = 0;
      tab.groups.forEach(function(g){
        var checked = 0;
        g.items.forEach(function(item){ if (state[item.key]) checked++; });
        tabTotal += g.items.length;
        tabChecked += checked;
        var el = document.querySelector('[data-gcount="' + g.gid + '"]');
        if (el) el.textContent = checked + ' / ' + g.items.length;
        var allCb = document.querySelector('[data-group-all="' + g.gid + '"]');
        if (allCb) {
          allCb.checked = (checked === g.items.length && g.items.length > 0);
          allCb.indeterminate = (checked > 0 && checked < g.items.length);
        }
      });
      grandTotal += tabTotal;
      grandChecked += tabChecked;
      var tabEl = document.querySelector('[data-tabcount="' + tabKey + '"]');
      if (tabEl) tabEl.textContent = tabChecked + '/' + tabTotal;

      var searchInput = document.querySelector('#panel-' + tabKey + ' .search-input');
      if (searchInput) applySearch(tabKey, searchInput.value);
    });
    var totalEl = document.getElementById('grandTotal');
    if (totalEl) totalEl.textContent = grandChecked + ' / ' + grandTotal;
    var bar = document.getElementById('progressBar');
    if (bar) bar.style.width = (grandTotal ? Math.round(grandChecked / grandTotal * 100) : 0) + '%';
  }

  function setActiveTab(tabKey){
    activeTab = tabKey;
    document.querySelectorAll('.panel').forEach(function(p){
      p.hidden = (p.id !== 'panel-' + tabKey);
    });
    document.querySelectorAll('.tabbtn').forEach(function(b){
      b.classList.toggle('active', b.dataset.tab === tabKey);
    });
  }

  function applySearch(tabKey, q){
    q = (q || '').trim().toLowerCase();
    var panel = document.getElementById('panel-' + tabKey);
    if (!panel) return;
    var hideFound = getHideFoundState(tabKey);

    panel.querySelectorAll('.group').forEach(function(det){
      var gid = det.dataset.gid;
      var g = findGroup(gid);
      var anyVisible = false;
      det.querySelectorAll('.item').forEach(function(row){
        var cb = row.querySelector('input[type=checkbox][data-key]');
        var itemKey = cb && cb.dataset.key;
        var itemChecked = !!(itemKey && state[itemKey]);
        var match = !q || row.dataset.search.indexOf(q) !== -1;
        var visible = match && !(hideFound && itemChecked);
        row.style.display = visible ? '' : 'none';
        if (visible) anyVisible = true;
      });

      if (hideFound && g && g.items.length > 0 && g.items.every(function(item){ return !!state[item.key]; })) {
        det.style.display = 'none';
        return;
      }

      det.style.display = anyVisible ? '' : 'none';
      if (q && anyVisible) det.open = true;
    });
  }

  // ---------- сохранение в файл ----------
  function buildSnapshotHtml(){
    var el = document.getElementById('pz-state');
    if (el) el.textContent = JSON.stringify(state);
    return '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  }
  function downloadBlob(blob, filename){
    var a = document.createElement('a');
    var url = URL.createObjectURL(blob);
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }
  async function saveToFile(){
    var html = buildSnapshotHtml();
    var blob = new Blob([html], { type: 'text/html' });
    if (window.showSaveFilePicker) {
      try {
        if (!fileHandle) {
          fileHandle = await window.showSaveFilePicker({
            suggestedName: 'checklist.html',
            types: [{ description: 'HTML файл', accept: { 'text/html': ['.html'] } }]
          });
        }
        var writable = await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();
        showToast('Сохранено в файл ✓');
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        fileHandle = null;
      }
    }
    downloadBlob(blob, 'checklist.html');
    showToast('Файл скачан — замените им старый checklist.html');
  }

  // ---------- события (делегирование, переживает повторный рендер) ----------
  document.addEventListener('click', function(e){
    var groupAllCb = e.target.closest('input[data-group-all]');
    if (groupAllCb) {
      // не даём клику по чекбоксу свернуть/развернуть <details> и мешать
      // нативному pre-click/canceled-activation тогглу чекбокса — решаем
      // сами, отталкиваясь от реального состояния группы, а не от
      // e.target.checked (оно ненадёжно в момент этого события)
      e.preventDefault();
      var gid = groupAllCb.dataset.groupAll;
      setTimeout(function(){
        var g = findGroup(gid);
        if (!g) return;
        var checkedCount = 0;
        g.items.forEach(function(item){ if (state[item.key]) checkedCount++; });
        var allChecked = g.items.length > 0 && checkedCount === g.items.length;
        toggleGroupAll(gid, !allChecked);
      }, 0);
      return;
    }

    var tabBtn = e.target.closest('.tabbtn');
    if (tabBtn) { setActiveTab(tabBtn.dataset.tab); return; }

    if (e.target.id === 'resetAllBtn') {
      if (confirm('Сбросить ВСЕ отметки во всех трёх чек-листах?')) {
        state = {};
        persist();
        renderApp();
      }
      return;
    }
  });

  document.addEventListener('change', function(e){
    if (e.target.matches('input[type=checkbox][data-key]')) {
      state[e.target.dataset.key] = e.target.checked;
      persist();
      updateCounts();
      return;
    }

    if (e.target.matches('.hide-found-toggle-input')) {
      setHideFoundState(e.target.dataset.tab, e.target.checked);
      updateCounts();
    }
  });

  document.addEventListener('input', function(e){
    if (e.target.classList && e.target.classList.contains('search-input')) {
      applySearch(e.target.dataset.tab, e.target.value);
    }
  });

  renderApp();
})();
</script>
</body>
</html>
