<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PZ Checklist — Books, Magazines, VHS</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="header-row">
      <h1 id="pageHeading">Project Zomboid — Checklist (Books · Magazines · VHS)</h1>
      <label class="language-picker">
        <span id="languageLabel">Language</span>
        <select id="languageSelect" aria-label="Language"></select>
      </label>
    </div>
    <div class="stats-row">
      <span class="grand"><span id="totalFoundLabel">Found:</span> <span id="grandTotal">0 / 0</span></span>
      <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
    </div>
    <div class="toolbar">
      <button type="button" id="exportBtn">Export JSON</button>
      <button type="button" id="importBtn">Import JSON</button>
      <button type="button" class="danger-outline" id="resetAllBtn">Reset all</button>
      <input type="file" id="importFileInput" accept="application/json,.json" hidden>
    </div>
    <nav class="tabs" id="tabsNav"></nav>
  </header>

  <main id="tabPanels"></main>
</div>

<div id="toast"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
